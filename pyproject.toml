[project]
name = "apptemplate"
version = "1.1.0"
description = "A template for creating Python desktop applications."
requires-python = "==3.13.*"
dependencies = [
	"wxPython>=4.2.3,<5",
]

[dependency-groups]
dev = [
	"pyinstaller>=6.11,<7",
	"prek>=0.4.8,<0.5",
	"pyright[nodejs]>=1.1.407,<1.2",
	"ruff>=0.14.5,<0.15",
	"scons>=4.10.1,<5",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"**/*.py",
	"SConstruct",
]

exclude = [
	".git",
	"__pycache__",
	"build",
	"dist",
	"install",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
extend-select = [
	"C901",
]

ignore = [
	# indentation contains tabs
	"W191",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# SConstruct contains many built-in functions not recognized by the lint.
"SConstruct" = ["F821"]

[tool.pyright]
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
]

exclude = [
	".git",
	"__pycache__",
]

extraPaths = [
	"./src",
]

analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

reportDeprecated = true
reportMissingTypeStubs = false

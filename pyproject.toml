[project]
name = "nvdaStyleChecker"
version = "1.1.0"
description = "System for checking add-on code and performing validation"
requires-python = "==3.13.*"
dependencies = [
	"wxPython>=4.2.3,<5",
]

[dependency-groups]
dev = [
	"pyinstaller>=6.11,<7",
	"prek>=0.4.8,<0.5",
	"pyright[nodejs]>=1.1.407,<1.2",
	"ruff>=0.14.5,<0.15",
	"scons>=4.10.1,<5",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"**/*.py",
	"SConstruct",
]

exclude = [
	".git",
	"__pycache__",
	"build",
	"dist",
	"install",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
extend-select = [
	"C901",
]

ignore = [
	# indentation contains tabs
	"W191",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# SConstruct contains many built-in functions not recognized by the lint.
"SConstruct" = ["F821"]

[tool.pyright]
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
	"src",
]

exclude = [
	".git",
	"__pycache__",
	"install",
]

extraPaths = [
	"./src",
]

analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

reportDeprecated = true

# wxPython accepts runtime coercions (e.g. size=(w, h), parent=Panel),
# but its type stubs do not fully reflect this behavior.
reportArgumentType = false

# wxPython methods (e.g. Add, Append, prePopup) return values that are
# intentionally ignored; the side effects are what matter.
reportUnusedCallResult = false

# wxPython is bundled with NVDA and does not ship with official type stubs.
# Pyright cannot resolve wx types in a standard environment.
reportMissingTypeStubs = false
reportUnknownMemberType = false

reportAttributeAccessIssue = false
reportImportCycles = false
reportUntypedBaseClass = false
reportUntypedFunctionDecorator = false

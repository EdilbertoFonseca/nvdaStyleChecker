name: Build with SCons

on:
  push:
    tags:
      - "*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build application
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.15"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install gettext
        shell: pwsh
        run: |
          choco install gettext -y --no-progress

          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machinePath;$userPath"

          $xgettext = Get-Command xgettext.exe -ErrorAction Stop
          $gettextBin = Split-Path -Parent $xgettext.Source

          $gettextBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Using gettext from: $gettextBin"
          xgettext --version
          msgmerge --version

      - name: Sync project environment
        run: |
          uv sync --locked

      - name: Run code checks
        run: |
          uv run prek run --all-files

      - name: Generate translation files
        run: |
          uv run scons pot

      - name: Build application
        run: |
          uv run scons

      - name: List build files
        shell: pwsh
        run: |
          Write-Host "=== dist ==="

          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse
          }
          else {
            Write-Error "dist directory was not created."
          }

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: appTemplate-${{ github.sha }}
          path: dist/**
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build with SCons

on:
  push:
    tags:
      - "*"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build application
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.15"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install gettext
        shell: pwsh
        run: |
          choco install gettext -y --no-progress

          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machinePath;$userPath"

          $xgettext = Get-Command xgettext.exe -ErrorAction Stop
          $gettextBin = Split-Path -Parent $xgettext.Source

          $gettextBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          Write-Host "Using gettext from: $gettextBin"
          xgettext --version
          msgmerge --version

      - name: Sync project environment
        run: |
          uv sync --locked

      - name: Run code checks
        run: |
          uv run prek run --all-files

      - name: Generate translation files
        run: |
          uv run scons pot

      - name: Build application
        run: |
          uv run scons

      - name: List build files
        shell: pwsh
        run: |
          Write-Host "=== dist ==="

          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse
          }
          else {
            Write-Error "dist directory was not created."
          }

      - name: Compress AppTemplate directory
        shell: pwsh
        run: |
          # Gets the name of the current repository (e.g., MyNewApp, AppTemplate, etc.)
          $repoName = '${{ github.event.repository.name }}'

          # Define the version based on the Tag or the short SHA Commit
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'
          } else {
            $version = '${{ github.sha }}'.Substring(0, 7)
          }

          $zipName = "$repoName-$version.zip"
          Write-Host "Creating zip package: $zipName"

          # Compresses the dist/AppTemplate folder into a dynamic .zip file.
          Compress-Archive -Path dist/AppTemplate -DestinationPath $zipName -Force

          # Save the file name for use in the next steps.
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
